<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karins Agenten</title>
<meta name="theme-color" content="#D7362A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --rot:#D7362A; --text:#3A2428; --leise:#8A6D72; --linie:#F3D5D8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; color:var(--text);
    background: linear-gradient(135deg,#FBDDE0 0%,#FFF8F8 55%,#F1E8FB 100%) fixed; min-height:100vh;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; }
  .kopf { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .kopf img.k { height:46px; } .kopf img.z { height:52px; }
  h1 { font-size:20px; margin:6px 0 14px; }
  .bereich { background:#fff; border:1px solid var(--linie); border-radius:14px; margin-top:12px; overflow:hidden; }
  .bereich > button { all:unset; display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; cursor:pointer;
    background:#FBE9EA; box-sizing:border-box; }
  .sym { width:36px; height:36px; border-radius:18px; color:#fff; display:grid; place-items:center; font-size:18px;
    background:linear-gradient(135deg,#D7362A,#F29AA0); flex:none; }
  .bt b { display:block; font-size:17px; } .bt span { font-size:13px; color:var(--leise); }
  .pf { margin-left:auto; color:var(--leise); }
  .inhalt { padding:10px; } .zu .inhalt { display:none; }
  .zeile { display:flex; align-items:center; gap:10px; border:1px solid var(--linie); border-radius:10px; padding:9px 10px; margin-bottom:8px; }
  .punkt { width:9px; height:9px; border-radius:50%; background:#4CC38A; flex:none; } .punkt.aus { background:#C8C2D6; }
  .zeile .tx { flex:1; } .zeile .tx b { font-size:15px; } .zeile .tx span { display:block; font-size:12.5px; color:var(--leise); }
  .starten { background:var(--rot); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-weight:600; font-size:14px; }
  .ansehen { background:#fff; color:var(--rot); border:1px solid var(--rot); border-radius:8px; padding:8px 12px; font-weight:600; font-size:14px; margin-right:6px; }
  #ansicht { position:fixed; inset:0; background:#fff; z-index:5; display:none; flex-direction:column; }
  #ansicht .leiste { display:flex; justify-content:space-between; align-items:center; padding:max(12px, env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--linie); }
  #ansicht .leiste button { background:var(--rot); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-weight:600; }
  #ansicht pre { margin:0; padding:14px 16px max(20px, env(safe-area-inset-bottom)); white-space:pre-wrap; word-break:break-word; font:inherit; font-size:15px; line-height:1.5; overflow:auto; flex:1; }
  #ansicht a { color:var(--rot); }
  #meldung { position:fixed; left:18px; right:18px; bottom:max(18px, env(safe-area-inset-bottom)); background:#3A2428; color:#fff;
    border-radius:12px; padding:12px 14px; font-size:14px; display:none; max-width:484px; margin:0 auto; }
</style>
</head>
<body>
<main>
  <div class="kopf"><img class="k" src="kachel-k.png" alt=""><img class="z" src="drei-zeichen.png" alt=""></div>
  <h1>Meine Agenten <small style="font-weight:400;font-size:12px;color:#8A6D72">v5</small></h1>
  <div id="liste"></div>
</main>
<div id="ansicht"><div class="leiste"><b id="atitel"></b><button id="azu">Schließen</button></div><pre id="atext"></pre></div>
<div id="meldung"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  var AGENTEN = [
    { name:'PA', text:'Dein persönlicher Assistent', zeichen:'✦', unter:[
      { name:'Morgen-Briefing', text:'Mails, Termine und offene Themen', befehl:'/offene-themen', ansehen:true, drive:'Morgen-Briefing', zeichen:'☀' },
      { name:'KI-News', text:'Die täglichen Top 10 mit Links', ansehen:true, drive:'KI-News', zeichen:'📰' } ] },
    { name:'Kommunikation', text:'Mails und Nachrichten', zeichen:'✉', unter:[
      { name:'Mails', text:'Newsletter prüfen und abhaken', befehl:'/email-aufraeumen', zeichen:'🧹' } ] }
  ];
  var liste = document.getElementById('liste'), meldung = document.getElementById('meldung'), mt;
  function zeigeMeldung(t) { meldung.textContent = t; meldung.style.display = 'block'; clearTimeout(mt); mt = setTimeout(function () { meldung.style.display = 'none'; }, 5000); }
  function starten(a) {
    var fertig = function () { zeigeMeldung('Befehl ' + a.befehl + ' kopiert. Jetzt in Claude einfügen und senden.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(a.befehl).then(fertig, function () { zeigeMeldung('Befehl: ' + a.befehl); }); }
    else { zeigeMeldung('Befehl: ' + a.befehl); }
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var CLIENT_ID = '219754550462-vt5vhfp4cqmrontb4j4prq7tljphvh23.apps.googleusercontent.com';
  var token = null, tokenBis = 0, tclient = null;
  function holeToken(fertig, fehler) {
    if (token && Date.now() < tokenBis) { fertig(token); return; }
    if (!window.google || !google.accounts) { fehler('Google-Anmeldung nicht geladen. Bitte Verbindung prüfen.'); return; }
    tclient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: function (r) { if (r.access_token) { token = r.access_token; tokenBis = Date.now() + (r.expires_in - 60) * 1000; fertig(token); } else { fehler('Anmeldung nicht möglich.'); } },
      error_callback: function () { fehler('Anmeldung abgebrochen.'); }
    });
    tclient.requestAccessToken();
  }
  function drive(pfad, t, text) {
    return fetch('https://www.googleapis.com/drive/v3/' + pfad, { headers: { Authorization: 'Bearer ' + t } }).then(function (r) { if (!r.ok) { throw new Error('Drive ' + r.status); } return text ? r.text() : r.json(); });
  }
  function ansehen(a) {
    var an = document.getElementById('ansicht'), tx = document.getElementById('atext');
    document.getElementById('atitel').textContent = a.name; tx.textContent = 'Anmelden bei Google ...'; an.style.display = 'flex';
    var zeigFehler = function (m) { tx.textContent = m; };
    holeToken(function (t) {
      tx.textContent = 'Lade ...';
      var q = encodeURIComponent("name='" + a.drive + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      drive('files?q=' + q + '&fields=files(id)', t).then(function (o) {
        if (!o.files.length) { throw new Error('Ordner ' + a.drive + ' nicht gefunden'); }
        var q2 = encodeURIComponent("'" + o.files[0].id + "' in parents and trashed=false");
        return drive('files?q=' + q2 + '&orderBy=name desc&pageSize=1&fields=files(id,name)', t);
      }).then(function (o) {
        if (!o.files.length) { throw new Error('Noch keine Datei im Ordner'); }
        document.getElementById('atitel').textContent = a.name + ' · ' + o.files[0].name.replace(/\.md$/, '');
        return drive('files/' + o.files[0].id + '?alt=media', t, true);
      }).then(function (txt) {
        tx.innerHTML = esc(txt).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      }).catch(function (e) { zeigFehler('Fehler: ' + e.message); });
    }, zeigFehler);
  }  document.getElementById('azu').onclick = function () { document.getElementById('ansicht').style.display = 'none'; };
  AGENTEN.forEach(function (b) {
    var box = document.createElement('div'); box.className = 'bereich';
    var kopf = document.createElement('button');
    kopf.innerHTML = '<div class="sym">' + b.zeichen + '</div><div class="bt"><b>' + b.name + '</b><span>' + b.text + '</span></div><div class="pf">▲</div>';
    var inh = document.createElement('div'); inh.className = 'inhalt';
    b.unter.forEach(function (a) {
      var z = document.createElement('div'); z.className = 'zeile';
      z.innerHTML = '<div class="punkt' + (a.befehl ? '' : ' aus') + '"></div><div class="tx"><b>' + a.zeichen + '  ' + a.name + '</b><span>' + a.text + '</span></div>';
      if (a.ansehen) { var s = document.createElement('button'); s.className = 'ansehen'; s.textContent = 'Ansehen'; s.onclick = function () { ansehen(a); }; z.appendChild(s); }
      if (a.befehl) { var k = document.createElement('button'); k.className = 'starten'; k.textContent = '▶ Starten'; k.onclick = function () { starten(a); }; z.appendChild(k); }
      inh.appendChild(z);
    });
    kopf.onclick = function () { var zu = box.classList.toggle('zu'); kopf.querySelector('.pf').textContent = zu ? '▼' : '▲'; };
    box.appendChild(kopf); box.appendChild(inh); liste.appendChild(box);
  });
  if ('serviceWorker' in navigator) { var erst = !navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', function () { if (!erst) { location.reload(); } erst = false; }); window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
